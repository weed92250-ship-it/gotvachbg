name: GotvachBG AI Publisher

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  build-and-publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Изтегляне на кода
        uses: actions/checkout@v4

      - name: Настройка на Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Инсталиране на библиотеки
        run: |
          pip install google-generativeai

      - name: Генериране на рецепта
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python generate_recipe.py

      - name: Публикуване
        run: |
          git config --global user.name 'GotvachBG AI Bot'
          git config --global user.email 'ai-bot@gotvachbg.pages.dev'
          git add latest_recipe.html
          git commit -m "🍳 Нова AI рецепта на деня" || exit 0
          git push
