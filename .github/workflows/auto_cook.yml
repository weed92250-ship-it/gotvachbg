name: GotvachBG AI Publisher

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install google-genai

      - name: Generate Recipe
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python generate_recipe.py

      - name: Commit and Push
        run: |
          git config --global user.name 'GotvachBG AI Bot'
          git config --global user.email 'bot@gotvachbg.com'
          git add .
          git diff --staged --quiet || git commit -m "🍳 Нова AI рецепта на деня"
          git push
