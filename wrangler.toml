name = "gotvachbg"
main = "src/index.js"
compatibility_date = "2026-01-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "public"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "gotvachbg-db"
database_id = "PUT-YOUR-DATABASE-ID-HERE"

[ai]
binding = "AI"

[triggers]
crons = ["0 6 * * *"]
