<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Готвач БГ — Рецепти всеки ден</title>
<meta name="description" content="Реални, проверени рецепти от цял свят, преведени на български. Категории, диетични филтри и нови ястия всеки ден.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#faf3e8;--card:#fff;--text:#3b2f2a;--muted:#8a7a6d;--accent:#b5502e;--accent2:#963f22;--border:#e4d8c7;--tag:#f0e4d3;--shadow:0 12px 30px rgba(72,48,35,.08)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:'IBM Plex Sans',sans-serif;background:var(--bg);color:var(--text);line-height:1.6}h1,h2,h3{font-family:'Space Grotesk',sans-serif;margin:0 0 8px}a{color:var(--accent);text-decoration:none}
header{background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border-bottom:1px solid var(--border);padding:12px 20px;position:sticky;top:0;z-index:20}.header-inner{max-width:1100px;margin:auto;display:flex;align-items:center;gap:18px}.logo{font-family:'Space Grotesk',sans-serif;font-size:23px;font-weight:700;color:var(--accent);white-space:nowrap}.search-box{flex:1;max-width:430px;margin-left:auto}.search-box input{width:100%;padding:10px 14px;border:1px solid var(--border);border-radius:999px;font-size:14px;font-family:inherit;background:var(--bg);color:var(--text);outline:none}.search-box input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(181,80,46,.1)}nav.admin-link{font-size:13px;color:var(--muted);white-space:nowrap}
main{max-width:1100px;margin:0 auto;padding:28px 20px 60px}.hero{display:grid;grid-template-columns:1.15fr .85fr;min-height:360px;background:var(--card);border:1px solid var(--border);border-radius:22px;overflow:hidden;box-shadow:var(--shadow);margin-bottom:28px}.hero-copy{padding:38px;display:flex;flex-direction:column;justify-content:center}.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:var(--accent);font-weight:600;margin-bottom:8px}.hero h1{font-size:clamp(30px,5vw,52px);line-height:1.02;margin-bottom:16px}.hero p{color:var(--muted);max-width:620px;margin:0 0 20px}.hero-image{min-height:300px;background:#eadfce}.hero-image img{width:100%;height:100%;object-fit:cover;display:block}.hero-placeholder{height:100%;min-height:300px;display:grid;place-items:center;color:var(--muted);font-size:42px}
.section-head{display:flex;justify-content:space-between;align-items:end;gap:15px;margin:30px 0 14px}.section-head h2{font-size:25px}.section-head span{font-size:13px;color:var(--muted)}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}.filter-btn{padding:7px 14px;border-radius:999px;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:13px;cursor:pointer;font-family:inherit}.filter-btn.active{background:var(--accent);border-color:var(--accent);color:#fff}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}.card{background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;transition:transform .15s,box-shadow .15s}.card:hover{transform:translateY(-3px);box-shadow:var(--shadow)}.card-media{aspect-ratio:4/3;background:#eadfce;overflow:hidden}.card img{width:100%;height:100%;object-fit:cover;display:block}.placeholder{height:100%;display:grid;place-items:center;color:var(--muted);font-size:30px}.card-body{padding:13px 14px 16px;display:flex;flex-direction:column;gap:6px;flex:1}.card-body h3{font-size:16px;line-height:1.3}.card-meta{font-size:12px;color:var(--muted)}.card-excerpt{font-size:13px;color:#65574e;line-height:1.45}.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto}.tag{background:var(--tag);color:var(--accent);font-size:11px;padding:2px 8px;border-radius:999px}
.empty-state{text-align:center;color:var(--muted);padding:60px 20px;grid-column:1/-1}.back-link{display:inline-block;margin-bottom:16px;font-size:14px;color:var(--muted)}.recipe-detail{max-width:850px;margin:auto}.recipe-detail>img{width:100%;border-radius:16px;margin:8px 0 18px;max-height:500px;object-fit:cover}.recipe-detail h1{font-size:clamp(30px,5vw,46px);line-height:1.1}.recipe-detail .meta{color:var(--muted);font-size:13px;margin-bottom:12px}.source-note{font-size:12px;color:var(--muted)}.ingredients-list{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px 22px;margin:24px 0}.ingredients-list ul{padding-left:20px;margin:0}.ingredients-list li{margin-bottom:7px}.instructions{font-size:16px}.instructions p{margin:0 0 15px}.similar{margin-top:40px}
.comments{margin-top:40px;border-top:1px solid var(--border);padding-top:22px}.comment{background:var(--card);border:1px solid var(--border);border-radius:9px;padding:10px 14px;margin-bottom:10px}.comment .cname{font-weight:600;font-size:13px}.comment .cdate{color:var(--muted);font-size:11px}.comment-form{display:flex;flex-direction:column;gap:8px;margin-top:16px}.comment-form input,.comment-form textarea{padding:10px 12px;border:1px solid var(--border);border-radius:7px;font-family:inherit;font-size:14px;background:var(--card);color:var(--text)}.comment-form textarea{min-height:80px;resize:vertical}.comment-form .hp{display:none}button{cursor:pointer;font-family:inherit}.btn{background:var(--accent);color:#fff;border:none;padding:9px 18px;border-radius:7px;font-size:14px}.btn:hover{background:var(--accent2)}.btn.secondary{background:transparent;color:var(--accent);border:1px solid var(--accent)}.btn.danger{background:#a3372b}
.admin-box{max-width:420px;margin:40px auto;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:24px}.admin-box input{width:100%;padding:9px 12px;border:1px solid var(--border);border-radius:6px;margin-bottom:12px;font-family:inherit;background:var(--bg);color:var(--text)}.admin-panel textarea{width:100%;min-height:100px;font-family:inherit;padding:9px 12px;border:1px solid var(--border);border-radius:6px;margin-bottom:10px;background:var(--card);color:var(--text)}.admin-panel input[type=text],.admin-panel input[type=url]{width:100%;padding:9px 12px;border:1px solid var(--border);border-radius:6px;margin-bottom:10px;font-family:inherit;background:var(--card);color:var(--text)}.admin-panel label{font-size:13px;display:block;margin-bottom:4px;color:var(--muted)}.admin-panel .checks{display:flex;gap:16px;margin-bottom:14px;font-size:13px}.admin-row{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:10px 14px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:10px}.admin-row .title{font-weight:600;font-size:14px}.admin-row .actions{display:flex;gap:6px}.tab-bar{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap}.tab-bar button{padding:8px 16px;border-radius:6px;border:1px solid var(--border);background:var(--card);color:var(--text)}.tab-bar button.active{background:var(--accent);color:#fff;border-color:var(--accent)}
@media(max-width:900px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.hero{grid-template-columns:1fr}.hero-copy{padding:30px}.hero-image{min-height:260px}}
@media(max-width:650px){header{padding:10px 12px}.header-inner{gap:9px;flex-wrap:wrap}.logo{font-size:20px}.search-box{order:3;flex-basis:100%;max-width:none}.search-box input{padding:9px 13px}main{padding:18px 12px 45px}.hero{border-radius:15px;margin-bottom:22px}.hero-copy{padding:24px}.hero h1{font-size:32px}.hero-image{min-height:220px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.card{border-radius:11px}.card-body{padding:10px 11px 13px}.card-body h3{font-size:14px}.card-excerpt{font-size:12px}.section-head{margin-top:24px}.recipe-detail h1{font-size:31px}.recipe-detail>img{border-radius:11px}.ingredients-list{padding:15px 17px}.tab-bar button{flex:1}.admin-row{align-items:flex-start;flex-direction:column}.admin-row .actions{width:100%}.admin-row .actions button{flex:1}}
@media(max-width:390px){.grid{grid-template-columns:1fr}.hero h1{font-size:29px}}
</style></head>
<body>
<header>
  <div class="header-inner">
    <a href="#/" class="logo">Готвач БГ</a>
    <div class="search-box"><input id="searchInput" type="text" placeholder="Търси рецепта..."></div>
    <nav class="admin-link"><a href="#/admin">Админ</a></nav>
  </div>
</header>
<main id="app"></main>

<script>
const state={recipes:[],loaded:false,search:'',dietFilter:'all',categoryFilter:'all'};
async function fetchJSON(url,opts){const res=await fetch(url,opts);const data=await res.json().catch(()=>({}));if(!res.ok)throw new Error(data.error||'Грешка');return data}
function escapeHtml(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}
async function ensureRecipesLoaded(){if(state.loaded)return;state.recipes=await fetchJSON('/api/recipes',{cache:'no-store'});state.loaded=true}
function normalizeSearch(v){return String(v||'').toLocaleLowerCase('bg-BG').normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim()}
function recipeMatchesSearch(r,q){const terms=normalizeSearch(q).split(/\s+/).filter(Boolean);if(!terms.length)return true;const ing=Array.isArray(r.ingredients)?r.ingredients:[];const hay=normalizeSearch([r.title,r.titleEn,r.excerpt,r.instructions,r.category,r.area,...(r.dietTags||[]),r.author,r.date,...ing.flatMap(i=>[i.name,i.measure])].join(' '));return terms.every(t=>hay.includes(t))}
function placeholder(){return '<div class="placeholder" aria-hidden="true">🍲</div>'}
function card(r){return '<a class="card" href="#/recipe/'+encodeURIComponent(r.id)+'"><div class="card-media">'+(r.image?'<img src="'+escapeHtml(r.image)+'" alt="'+escapeHtml(r.title)+'" loading="lazy" onerror="this.parentElement.innerHTML=\''+placeholder().replace(/'/g,"\\'")+'\'">':placeholder())+'</div><div class="card-body"><h3>'+escapeHtml(r.title)+'</h3><div class="card-meta">'+escapeHtml(r.category)+' · '+escapeHtml(r.area)+(r.time?' · '+escapeHtml(r.time):'')+'</div><div class="card-excerpt">'+escapeHtml(r.excerpt)+'</div><div class="tags">'+(r.dietTags||[]).map(t=>'<span class="tag">'+escapeHtml(t)+'</span>').join('')+'</div></div></a>'}
function setMeta(title,description){document.title=title;let m=document.querySelector('meta[name="description"]');if(m)m.content=description}
function router(){const hash=location.hash||'#/';const app=document.getElementById('app');if(hash.startsWith('#/recipe/'))renderRecipeDetail(app,decodeURIComponent(hash.split('/')[2]||''));else if(hash==='#/admin')renderAdmin(app);else renderHome(app)}
async function renderHome(app){app.innerHTML='<p>Зареждане...</p>';await ensureRecipesLoaded();setMeta('Готвач БГ — Домашни рецепти','Подбрани рецепти на български с продукти, стъпки, категории и диетични филтри.');const categories=['all',...new Set(state.recipes.map(r=>r.category).filter(Boolean))];const diets=['all','кето','без захар','вегетарианско'];let list=state.recipes;if(state.search.trim())list=list.filter(r=>recipeMatchesSearch(r,state.search));if(state.categoryFilter!=='all')list=list.filter(r=>r.category===state.categoryFilter);if(state.dietFilter!=='all')list=list.filter(r=>(r.dietTags||[]).includes(state.dietFilter));const featured=!state.search&&!state.categoryFilter&&!state.dietFilter?state.recipes.find(r=>r.featured):null;const catBtns=categories.map(c=>'<button class="filter-btn '+(state.categoryFilter===c?'active':'')+'" data-cat="'+escapeHtml(c)+'">'+(c==='all'?'Всички кухни':escapeHtml(c))+'</button>').join('');const dietBtns=diets.map(d=>'<button class="filter-btn '+(state.dietFilter===d?'active':'')+'" data-diet="'+escapeHtml(d)+'">'+(d==='all'?'Всички диети':escapeHtml(d))+'</button>').join('');const rest=featured?list.filter(r=>r.id!==featured.id):list;app.innerHTML=(featured?'<a class="hero" href="#/recipe/'+encodeURIComponent(featured.id)+'"><div class="hero-copy"><div class="eyebrow">Препоръчана рецепта</div><h1>'+escapeHtml(featured.title)+'</h1><p>'+escapeHtml(featured.excerpt)+'</p><span class="btn" style="align-self:flex-start">Виж рецептата →</span></div><div class="hero-image">'+(featured.image?'<img src="'+escapeHtml(featured.image)+'" alt="'+escapeHtml(featured.title)+'">':placeholder())+'</div></a>':'')+'<div class="section-head"><div><h2>'+(state.search?'Резултати от търсенето':'Рецепти')+'</h2><span>'+rest.length+' рецепти</span></div></div><div class="filters">'+catBtns+'</div><div class="filters">'+dietBtns+'</div><div class="grid">'+(rest.map(card).join('')||'<div class="empty-state">Няма намерени рецепти.</div>')+'</div>';app.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{state.categoryFilter=b.dataset.cat;renderHome(app)});app.querySelectorAll('[data-diet]').forEach(b=>b.onclick=()=>{state.dietFilter=b.dataset.diet;renderHome(app)})}
async function renderRecipeDetail(app,id){app.innerHTML='<p>Зареждане...</p>';let r;try{r=await fetchJSON('/api/recipes/'+encodeURIComponent(id))}catch(e){app.innerHTML='<p>Рецептата не е намерена.</p>';return}const comments=await fetchJSON('/api/comments/'+encodeURIComponent(id)).catch(()=>[]);await ensureRecipesLoaded();const related=state.recipes.filter(x=>x.id!==r.id).map(x=>{let score=0;if(x.category===r.category)score+=5;if(x.area===r.area)score+=3;for(const t of (r.dietTags||[]))if((x.dietTags||[]).includes(t))score+=2;const ri=new Set((r.ingredients||[]).map(i=>normalizeSearch(i.name)).filter(Boolean));for(const i of (x.ingredients||[]))if(ri.has(normalizeSearch(i.name)))score+=1;return {x,score}}).filter(v=>v.score>0).sort((a,b)=>b.score-a.score).slice(0,4).map(v=>v.x);setMeta(r.title+' — Готвач БГ',r.excerpt||'Рецепта от Готвач БГ.');app.innerHTML='<a href="#/" class="back-link">← Всички рецепти</a><div class="recipe-detail"><h1>'+escapeHtml(r.title)+'</h1><div class="meta">'+escapeHtml(r.author)+' · '+escapeHtml(r.date)+' · '+escapeHtml(r.category)+' · '+escapeHtml(r.area)+(r.time?' · '+escapeHtml(r.time):'')+'</div>'+(r.sourceUrl?'<p class="source-note">Източник: <a href="'+escapeHtml(r.sourceUrl)+'" target="_blank" rel="noopener">Уикикниги – Готварска книга</a> · <a href="'+escapeHtml(r.sourceLicenseUrl)+'" target="_blank" rel="noopener">CC BY-SA 4.0</a> · преработено за Готвач БГ.</p>':'')+(r.image?'<img src="'+escapeHtml(r.image)+'" alt="'+escapeHtml(r.title)+'" onerror="this.replaceWith(Object.assign(document.createElement(\'div\'),{className:\'hero-placeholder\',innerHTML:\'🍲\'}))">':'')+'<div class="tags">'+(r.dietTags||[]).map(t=>'<span class="tag">'+escapeHtml(t)+'</span>').join('')+'</div><div class="ingredients-list"><h2>Съставки</h2><ul>'+(r.ingredients||[]).map(i=>'<li>'+escapeHtml(i.measure)+' '+escapeHtml(i.name)+'</li>').join('')+'</ul></div><div class="instructions"><h2>Начин на приготвяне</h2>'+(r.instructions||'').split(/\n\n+/).map(p=>'<p>'+escapeHtml(p)+'</p>').join('')+'</div>'+(r.youtube?'<p><a href="'+escapeHtml(r.youtube)+'" target="_blank" rel="noopener">Видео рецепта →</a></p>':'')+(related.length?'<section class="similar"><div class="section-head"><div><h2>Подобни рецепти</h2><span>по кухня, категория и съставки</span></div></div><div class="grid">'+related.map(card).join('')+'</div></section>':'')+'<div class="comments"><h2>Коментари</h2><div id="commentsList">'+(comments.map(c=>'<div class="comment"><div class="cname">'+escapeHtml(c.name)+' <span class="cdate">· '+escapeHtml(c.date)+'</span></div><div>'+escapeHtml(c.text)+'</div></div>').join('')||'<p style="color:var(--text-muted);font-size:14px;">Все още няма коментари.</p>')+'</div><form class="comment-form" id="commentForm"><input type="text" name="website" class="hp" tabindex="-1" autocomplete="off"><input type="text" name="name" placeholder="Твоето име" required maxlength="80"><textarea name="text" placeholder="Сподели мнение или съвет..." required maxlength="2000"></textarea><button class="btn" type="submit">Публикувай коментар</button></form></div></div>';document.getElementById('commentForm').onsubmit=async e=>{e.preventDefault();const f=e.target;try{await fetchJSON('/api/comments/'+encodeURIComponent(id),{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({name:f.name.value,text:f.text.value,website:f.website.value})});renderRecipeDetail(app,id)}catch(err){alert('Грешка при изпращане на коментара.')}}}
function renderAdmin(app){window.location.href='/admin'}
function getAdminKey(){return localStorage.getItem('gotvachbg_admin_key')}
function setAdminKey(k){localStorage.setItem('gotvachbg_admin_key',k)}
function clearAdminKey(){localStorage.removeItem('gotvachbg_admin_key')}
async function renderAdminPanel(app,key,tab='recipes'){
  app.innerHTML='<div class="admin-panel"><div class="tab-bar"><button data-tab="recipes" class="'+(tab==='recipes'?'active':'')+'">Рецепти</button><button data-tab="add" class="'+(tab==='add'?'active':'')+'">Добави рецепта</button><button data-tab="comments" class="'+(tab==='comments'?'active':'')+'">Коментари</button><button class="btn secondary" id="logoutBtn" style="margin-left:auto">Изход</button></div><div id="tabContent">Зареждане...</div></div>';
  document.getElementById('logoutBtn').onclick=()=>{clearAdminKey();location.href='/admin'};
  app.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>renderAdminPanel(app,key,b.dataset.tab));
  const content=document.getElementById('tabContent');
  if(tab==='recipes'){
    await ensureRecipesLoaded();
    content.innerHTML=state.recipes.map(r=>'<div class="admin-row"><span class="title">'+escapeHtml(r.title)+'</span><span class="actions"><button class="btn secondary" data-edit="'+escapeHtml(r.id)+'">Редактирай</button><button class="btn danger" data-del="'+escapeHtml(r.id)+'">Изтрий</button></span></div>').join('')||'<p>Няма рецепти.</p>';
    content.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{if(!confirm('Да изтрия ли тази рецепта?'))return;await fetchJSON('/api/recipes/'+encodeURIComponent(b.dataset.del),{method:'DELETE',headers:{'x-admin-key':key}});state.loaded=false;renderAdminPanel(app,key,'recipes')});
    content.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>renderRecipeForm(app,key,b.dataset.edit));
  }else if(tab==='add'){renderRecipeForm(app,key,null)}
  else{
    const comments=await fetchJSON('/api/all-comments',{headers:{'x-admin-key':key}}).catch(()=>[]);
    content.innerHTML=comments.map(c=>'<div class="admin-row"><span><span class="title">'+escapeHtml(c.name)+'</span> — '+escapeHtml(c.text)+'<br><span style="color:var(--text-muted);font-size:12px">към „'+escapeHtml(c.recipeTitle||'')+'“ · '+escapeHtml(c.date)+'</span></span><span class="actions"><button class="btn danger" data-delc="'+escapeHtml(c.id)+'" data-recipe="'+escapeHtml(c.recipeId)+'">Изтрий</button></span></div>').join('')||'<p>Няма коментари.</p>';
    content.querySelectorAll('[data-delc]').forEach(b=>b.onclick=async()=>{await fetchJSON('/api/comments/'+encodeURIComponent(b.dataset.recipe)+'?id='+encodeURIComponent(b.dataset.delc),{method:'DELETE',headers:{'x-admin-key':key}});renderAdminPanel(app,key,'comments')});
  }
}
async function renderRecipeForm(app,key,id){
  const content=document.getElementById('tabContent');
  let r={title:'',excerpt:'',ingredients:[],instructions:'',category:'',area:'',dietTags:[],image:'',youtube:'',featured:false};
  if(id)r=await fetchJSON('/api/recipes/'+encodeURIComponent(id));
  const ingredientsText=(r.ingredients||[]).map(i=>i.name+' | '+i.measure).join('\n');
  content.innerHTML='<h2>'+(id?'Редактиране на рецепта':'Нова рецепта')+'</h2><label>Заглавие</label><input type="text" id="f_title" value="'+escapeHtml(r.title)+'"><label>Кратко описание</label><input type="text" id="f_excerpt" value="'+escapeHtml(r.excerpt)+'"><label>Съставки (по един ред, формат: име | количество)</label><textarea id="f_ingredients">'+escapeHtml(ingredientsText)+'</textarea><label>Начин на приготвяне (абзаци разделени с празен ред)</label><textarea id="f_instructions" style="min-height:160px">'+escapeHtml(r.instructions)+'</textarea><label>Категория</label><input type="text" id="f_category" value="'+escapeHtml(r.category)+'"><label>Кухня</label><input type="text" id="f_area" value="'+escapeHtml(r.area)+'"><label>Снимка (URL)</label><input type="url" id="f_image" value="'+escapeHtml(r.image||'')+'"><label>YouTube линк (по избор)</label><input type="url" id="f_youtube" value="'+escapeHtml(r.youtube||'')+'"><div class="checks"><label><input type="checkbox" id="f_keto" '+((r.dietTags||[]).includes('кето')?'checked':'')+'> Кето</label><label><input type="checkbox" id="f_nosugar" '+((r.dietTags||[]).includes('без захар')?'checked':'')+'> Без захар</label><label><input type="checkbox" id="f_veg" '+((r.dietTags||[]).includes('вегетарианско')?'checked':'')+'> Вегетарианско</label><label><input type="checkbox" id="f_featured" '+(r.featured?'checked':'')+'> Препоръчана (начална страница)</label></div><button class="btn" id="saveBtn">'+(id?'Запази промените':'Публикувай')+'</button>';
  document.getElementById('saveBtn').onclick=async()=>{
    const ingredients=document.getElementById('f_ingredients').value.split('\n').filter(Boolean).map(line=>{const [name,measure]=line.split('|').map(s=>(s||'').trim());return{name,measure:measure||''}});
    const dietTags=[];if(document.getElementById('f_keto').checked)dietTags.push('кето');if(document.getElementById('f_nosugar').checked)dietTags.push('без захар');if(document.getElementById('f_veg').checked)dietTags.push('вегетарианско');
    const body={id,title:document.getElementById('f_title').value,excerpt:document.getElementById('f_excerpt').value,ingredients,instructions:document.getElementById('f_instructions').value,category:document.getElementById('f_category').value,area:document.getElementById('f_area').value,dietTags,image:document.getElementById('f_image').value,youtube:document.getElementById('f_youtube').value,featured:document.getElementById('f_featured').checked};
    try{await fetchJSON('/api/recipes'+(id?'/'+encodeURIComponent(id):''),{method:id?'PUT':'POST',headers:{'content-type':'application/json','x-admin-key':key},body:JSON.stringify(body)});state.loaded=false;renderAdminPanel(app,key,'recipes')}catch(e){alert('Грешка при запис: '+e.message)}
  };
}

let searchTimer;document.getElementById('searchInput').addEventListener('input',e=>{state.search=e.target.value;clearTimeout(searchTimer);searchTimer=setTimeout(()=>{state.loaded=false;if(!location.hash.startsWith('#/recipe/')&&location.hash!=='#/admin')router()},180)});window.addEventListener('hashchange',router);router();
</script>
</body>
</html>
